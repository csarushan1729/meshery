apiVersion: core.meshery.io/v1alpha1
kind: Design
metadata:
  name: Cloud-Native-Microservices-Stack
  labels:
    meshery.io/type: design
spec:
  components:
    - id: frontend-deployment
      type: Deployment
      model: kubernetes
      name: frontend
      configuration:
        replicas: 2
        selector:
          matchLabels:
            app: frontend
        template:
          metadata:
            labels:
              app: frontend
          spec:
            containers:
              - name: nginx
                image: nginx:latest
                ports:
                  - containerPort: 80

    - id: backend-deployment
      type: Deployment
      model: kubernetes
      name: backend-api
      configuration:
        replicas: 2
        selector:
          matchLabels:
            app: backend
        template:
          metadata:
            labels:
              app: backend
          spec:
            containers:
              - name: api
                image: hashicorp/http-echo
                args:
                  - "-text=Backend API is running"
                ports:
                  - containerPort: 5678

    - id: redis-deployment
      type: Deployment
      model: kubernetes
      name: redis-cache
      configuration:
        replicas: 1
        selector:
          matchLabels:
            app: redis
        template:
          metadata:
            labels:
              app: redis
          spec:
            containers:
              - name: redis
                image: redis:alpine
                ports:
                  - containerPort: 6379

    - id: postgres-statefulset
      type: StatefulSet
      model: kubernetes
      name: postgres-db
      configuration:
        replicas: 1
        selector:
          matchLabels:
            app: postgres
        serviceName: postgres
        template:
          metadata:
            labels:
              app: postgres
          spec:
            containers:
              - name: postgres
                image: postgres:15
                ports:
                  - containerPort: 5432
                env:
                  - name: POSTGRES_PASSWORD
                    value: "meshery123"

    - id: frontend-service
      type: Service
      model: kubernetes
      name: frontend-service
      configuration:
        selector:
          app: frontend
        ports:
          - port: 80
            targetPort: 80
        type: ClusterIP

    - id: backend-service
      type: Service
      model: kubernetes
      name: backend-service
      configuration:
        selector:
          app: backend
        ports:
          - port: 80
            targetPort: 5678
        type: ClusterIP

    - id: ingress
      type: Ingress
      model: kubernetes
      name: main-ingress
      configuration:
        rules:
          - http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: frontend-service
                      port:
                        number: 80

  relationships: []
