name: my-first-design
services:
  web-app-deployment:
    type: Deployment
    apiVersion: apps/v1
    settings:
      replicas: 2
      selector:
        matchLabels:
          app: web-app
      template:
        metadata:
          labels:
            app: web-app
        spec:
          containers:
            - name: web-app
              image: nginx:latest
              ports:
                - containerPort: 80
  web-app-service:
    type: Service
    apiVersion: v1
    settings:
      selector:
        app: web-app
      ports:
        - protocol: TCP
          port: 80
          targetPort: 80
      type: ClusterIP
